name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Manual runs ("Run workflow" in the Actions tab) run the build only; the release job needs a push to main.
  workflow_dispatch:

permissions:
  contents: read

# Runs on main each have their own group so no release is lost; two close merges may therefore publish releases out of order.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Required status check of the ruleset on main: renaming this job stops pull requests from merging.
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Compile and static checks
        run: ./mvnw -B -ntp test-compile spotless:check checkstyle:check pmd:check spotbugs:check

      - name: Unit and architecture tests
        run: ./mvnw -B -ntp test

      # Stage 3 appends to the coverage file that stage 2 wrote, so the gate counts unit and
      # system tests together: never add clean here.
      - name: System tests and coverage gate
        run: >-
          ./mvnw -B -ntp verify -DskipUnitTests=true -Dspotless.check.skip=true
          -Dcheckstyle.skip=true -Dpmd.skip=true -Dspotbugs.skip=true

      - name: Upload test reports
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          overwrite: true
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
            target/scenarios
            target/events.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Read the project version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          version=$(./mvnw -B -ntp -q org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=project.version -DforceStdout)
          if [ -z "$version" ]; then
            echo "::error::Could not read the project version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Zip the coverage report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cd target/site/jacoco && zip -r "$GITHUB_WORKSPACE/jacoco-report.zip" .

      - name: Upload release files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          overwrite: true
          path: |
            target/tunnel-*.jar
            jacoco-report.zip
          if-no-files-found: error
          # Only passes the files to the release job; the release is the lasting copy.
          retention-days: 5

  release:
    name: release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files

      - name: Create the GitHub release
        env:
          VERSION: ${{ needs.build.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "::error::The project version is empty"
            exit 1
          fi
          TAG="v${VERSION%-SNAPSHOT}-build.${RUN_NUMBER}"
          ASSETS=(target/tunnel-*.jar jacoco-report.zip)
          # A re-run finds the release an earlier attempt left (possibly a draft, or missing
          # assets): upload the assets again and publish it, instead of creating a second one.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$TAG exists; uploading its assets again and publishing it"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          gh release create "$TAG" "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes
